<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#211858;
}

.calculator{
    background:#deee06;
    padding:20px;
    border-radius:15px;
    width:360px;
    box-shadow:0 0 15px rgba(0,0,0,.6);
}

#display{
    width:100%;
    height:60px;
    font-size:26px;
    text-align:right;
    padding:10px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
    background:#111;
    color:#fff;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

button{
    height:55px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#111;
    color:white;
    transition:.2s;
}

button:hover{
    background:#3b3939;
}

.operator{
    background:#ff9800;
}

.operator:hover{
    background:#ffb84d;
}

.equal{
    background:#2114dd;
}

.equal:hover{
    background:#6392eb;
}

.clear{
    background:#d81327;
}

.clear:hover{
    background:#f25565;
}
</style>
</head>

<body>

<div class="calculator">
<input type="text" id="display" readonly>

<div class="buttons">

<button onclick="clearDisplay()" class="clear">C</button>
<button onclick="del()">DEL</button>
<button onclick="append('(')">(</button>
<button onclick="append(')')">)</button>
<button onclick="append('/')">÷</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button onclick="append('*')">×</button>
<button onclick="sqrt()">√</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button onclick="append('-')">−</button>
<button onclick="square()">x²</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="append('+')">+</button>
<button onclick="power()">^</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="append(Math.PI)">π</button>
<button onclick="append(Math.E)">e</button>
<button onclick="calculate()" class="equal">=</button>

<button onclick="sin()">sin</button>
<button onclick="cos()">cos</button>
<button onclick="tan()">tan</button>
<button onclick="log()">log</button>
<button onclick="ln()">ln</button>

</div>
</div>

<script>

let display=document.getElementById("display");

function append(value){
    display.value+=value;
}

function clearDisplay(){
    display.value="";
}

function del(){
    display.value=display.value.slice(0,-1);
}

function calculate(){
    try{
        display.value=eval(display.value);
    }
    catch{
        display.value="Error";
    }
}

function sqrt(){
    display.value=Math.sqrt(eval(display.value));
}

function square(){
    display.value=Math.pow(eval(display.value),2);
}

function power(){
    display.value+="**";
}

function sin(){
    display.value=Math.sin(eval(display.value)*Math.PI/180);
}

function cos(){
    display.value=Math.cos(eval(display.value)*Math.PI/180);
}

function tan(){
    display.value=Math.tan(eval(display.value)*Math.PI/180);
}

function log(){
    display.value=Math.log10(eval(display.value));
}

function ln(){
    display.value=Math.log(eval(display.value));
}

</script>

</body>
</html>
